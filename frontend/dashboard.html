<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PokeTrader — Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>PokeTrader</h1>

<nav>
  <a href="#" onclick="navigate('cards')">Card Browser</a>
  <a href="#" onclick="navigate('collection')">My Collection</a>
  <a href="#" onclick="navigate('trades')">Trades</a>
  <a href="#" onclick="navigate('profile')">Profile</a>
  <a href="#" onclick="logout()">Logout</a>
  <span id="sidebar-name"></span>
</nav>

<hr>

<!-- CARDS PAGE -->
<div id="page-cards">
  <h2>Card Browser</h2>
  <p>
    Search: <input type="text" id="card-search" oninput="renderCards()">
    &nbsp; Type: <select id="type-filter" onchange="renderCards()">
      <option>All</option>
      <option>Fire</option><option>Water</option><option>Grass</option>
      <option>Psychic</option><option>Lightning</option><option>Fighting</option>
      <option>Colorless</option><option>Trainer</option><option>Energy</option>
    </select>
  </p>
  <p id="results-count"></p>
  <table>
    <thead><tr><th>ID</th><th>Name</th><th>Type</th><th>HP</th><th>Set</th><th>Action</th></tr></thead>
    <tbody id="cards-tbody"></tbody>
  </table>
</div>

<!-- COLLECTION PAGE -->
<div id="page-collection" class="hidden">
  <h2>My Collection</h2>
  <p>Search: <input type="text" id="col-search" oninput="renderCollection()"></p>
  <p id="col-stats"></p>
  <table>
    <thead><tr><th>ID</th><th>Name</th><th>Type</th><th>HP</th><th>Set</th><th>Action</th></tr></thead>
    <tbody id="collection-tbody"></tbody>
  </table>
  <p id="col-empty"></p>
</div>

<!-- TRADES PAGE -->
<div id="page-trades" class="hidden">
  <h2>Trades</h2>
  <div id="trade-list"></div>
</div>

<!-- PROFILE PAGE -->
<div id="page-profile" class="hidden">
  <h2>Profile</h2>
  <div id="profile-content"></div>
</div>

<!-- CARD DETAIL MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal">
    <button onclick="closeModalDirect()">Close</button>
    <h3 id="modal-title"></h3>
    <div id="modal-body"></div>
  </div>
</div>

const MOCK_TRADES = [
  {tradeId:1, initiator:'ash',   receiver:'misty', initiatorCard:4,  receiverCard:2,  status:'Request',  time:'2026-04-19'},
  {tradeId:2, initiator:'misty', receiver:'ash',   initiatorCard:14, receiverCard:10, status:'Accepted', time:'2026-04-18'}
];

const user = JSON.parse(sessionStorage.getItem('pt_user') || 'null');
if (!user) window.location.href = 'index.html';

let collection = JSON.parse(localStorage.getItem(`pt_collection_${user.id}`) || '[]');
let trades = [...MOCK_TRADES];

document.getElementById('sidebar-name').textContent = `(${user.firstName} ${user.lastName})`;

function navigate(page) {
  ['cards','collection','trades','profile'].forEach(p => {
    document.getElementById(`page-${p}`).classList.toggle('hidden', p !== page);
  });
  if (page === 'collection') renderCollection();
  if (page === 'trades')     renderTrades();
  if (page === 'profile')    renderProfile();
}

function renderCards() {
  const q    = document.getElementById('card-search').value.toLowerCase();
  const type = document.getElementById('type-filter').value;
  const filtered = CARDS.filter(c =>
    (type === 'All' || c.type === type) &&
    (!q || c.name.toLowerCase().includes(q))
  );
  document.getElementById('results-count').textContent = `${filtered.length} card(s) found`;
  document.getElementById('cards-tbody').innerHTML = filtered.map(c => `
    <tr>
      <td>${c.id}</td>
      <td><a href="#" onclick="openModal(${c.id})">${c.name}</a></td>
      <td>${c.type}</td>
      <td>${c.hp ?? ''}</td>
      <td>${c.set}</td>
      <td>${collection.includes(c.id)
        ? `<button onclick="removeFromCollection(${c.id})">Remove</button>`
        : `<button onclick="addToCollection(${c.id})">Add</button>`
      }</td>
    </tr>`).join('');
}

function renderCollection() {
  const q = document.getElementById('col-search').value.toLowerCase();
  const colCards = CARDS.filter(c => collection.includes(c.id) && (!q || c.name.toLowerCase().includes(q)));
  document.getElementById('col-stats').textContent = `${collection.length} card(s) in collection`;
  document.getElementById('col-empty').textContent = colCards.length === 0 ? 'No cards match.' : '';
  document.getElementById('collection-tbody').innerHTML = colCards.map(c => `
    <tr>
      <td>${c.id}</td>
      <td><a href="#" onclick="openModal(${c.id})">${c.name}</a></td>
      <td>${c.type}</td>
      <td>${c.hp ?? ''}</td>
      <td>${c.set}</td>
      <td><button onclick="removeFromCollection(${c.id})">Remove</button></td>
    </tr>`).join('');
}

function renderTrades() {
  const myTrades = trades.filter(t => t.initiator === user.username || t.receiver === user.username);
  if (myTrades.length === 0) { document.getElementById('trade-list').innerHTML = '<p>No trades yet.</p>'; return; }
  document.getElementById('trade-list').innerHTML = myTrades.map(t => {
    const ic = CARDS.find(c => c.id === t.initiatorCard);
    const rc = CARDS.find(c => c.id === t.receiverCard);
    const isIncoming = t.receiver === user.username && t.status === 'Request';
    const actions = isIncoming
      ? `<button onclick="respondTrade(${t.tradeId},'Accepted')">Accept</button>
         <button onclick="respondTrade(${t.tradeId},'Denied')">Deny</button>`
      : `Status: ${t.status}`;
    return `<p>${t.initiator} offers <strong>${ic?.name}</strong> for ${t.receiver}'s <strong>${rc?.name}</strong> — ${t.time} — ${actions}</p>`;
  }).join('');
}

function respondTrade(id, status) {
  const t = trades.find(x => x.tradeId === id);
  if (t) { t.status = status; renderTrades(); }
}

function renderProfile() {
  document.getElementById('profile-content').innerHTML = `
    <p>Name: ${user.firstName} ${user.lastName}</p>
    <p>Username: ${user.username}</p>
    <p>User ID: ${user.id}</p>
    <p>Role: ${user.role}</p>
    <p>Collection: ${collection.length} card(s)</p>
    <p>Pending trades: ${trades.filter(t => t.receiver === user.username && t.status === 'Request').length}</p>`;
}

function addToCollection(id) {
  if (!collection.includes(id)) {
    collection.push(id);
    localStorage.setItem(`pt_collection_${user.id}`, JSON.stringify(collection));
    renderCards();
  }
}

function removeFromCollection(id) {
  collection = collection.filter(x => x !== id);
  localStorage.setItem(`pt_collection_${user.id}`, JSON.stringify(collection));
  const activePage = ['cards','collection','trades','profile'].find(p => !document.getElementById(`page-${p}`).classList.contains('hidden'));
  if (activePage === 'collection') renderCollection(); else renderCards();
}

function openModal(id) {
  const c = CARDS.find(x => x.id === id);
  if (!c) return;
  document.getElementById('modal-title').textContent = c.name;
  document.getElementById('modal-body').innerHTML = `
    <p>ID: ${c.id}</p>
    <p>Type: ${c.type}</p>
    ${c.hp != null ? `<p>HP: ${c.hp}</p>` : ''}
    <p>Set: ${c.set}</p>
    <p>In collection: ${collection.includes(c.id) ? 'Yes' : 'No'}</p>`;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModalDirect();
}
function closeModalDirect() {
  document.getElementById('modal-overlay').classList.remove('open');
}

function logout() {
  sessionStorage.removeItem('pt_user');
  window.location.href = 'index.html';
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModalDirect(); });

renderCards();
</script>
